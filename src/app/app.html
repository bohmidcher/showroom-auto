<app-head-bar></app-head-bar>

<app-search-bar
  [autos]="autoList"
  (selectAutoEvent)="updateAuto($event)">
</app-search-bar>

<section class="details" *ngIf="selectedAuto as auto">
  <h2>Caractéristiques de la voiture</h2>

  <img
    [src]="auto.photo"
    [alt]="auto.modele"
    width="300"
  />

  <p><strong>Marque :</strong> {{ auto.marque }}</p>
  <p><strong>Modèle :</strong> {{ auto.modele }}</p>
  <p><strong>Prix :</strong> {{ auto.prix }} TND</p>
  <p><strong>Puissance :</strong> {{ auto.puissance }} CV</p>
  <p><strong>Unités disponibles :</strong> {{ auto.nombreUnites }}</p>
</section>
